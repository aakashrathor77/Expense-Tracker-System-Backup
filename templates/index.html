<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Expense Tracker</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans">

    <div class="container mx-auto p-6 max-w-5xl">

        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">
            Personal Expense Tracker
        </h1>


        <!-- Dashboard Summary -->

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">

            <div class="bg-white p-5 rounded-lg shadow-md">
                <p class="text-sm text-gray-500">
                    Total Spending
                </p>

                <p
                    id="summary-total"
                    class="text-2xl font-bold text-blue-600 mt-2"
                >
                    ₹0.00
                </p>
            </div>


            <div class="bg-white p-5 rounded-lg shadow-md">
                <p class="text-sm text-gray-500">
                    Total Transactions
                </p>

                <p
                    id="summary-count"
                    class="text-2xl font-bold text-green-600 mt-2"
                >
                    0
                </p>
            </div>


            <div class="bg-white p-5 rounded-lg shadow-md">
                <p class="text-sm text-gray-500">
                    Average Expense
                </p>

                <p
                    id="summary-average"
                    class="text-2xl font-bold text-purple-600 mt-2"
                >
                    ₹0.00
                </p>
            </div>


            <div class="bg-white p-5 rounded-lg shadow-md">
                <p class="text-sm text-gray-500">
                    Highest Expense
                </p>

                <p
                    id="summary-highest"
                    class="text-2xl font-bold text-red-600 mt-2"
                >
                    ₹0.00
                </p>
            </div>

        </div>


        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">


            <!-- Add Expense -->

            <div class="bg-white p-6 rounded-lg shadow-md">

                <h2 class="text-xl font-semibold mb-4 text-gray-700">
                    Add New Expense
                </h2>


                <form id="expense-form" class="space-y-4">

                    <div>
                        <label class="block text-sm font-medium text-gray-600">
                            Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            required
                            placeholder="Enter expense title"
                            class="w-full mt-1 p-2 border rounded-md"
                        >
                    </div>


                    <div>
                        <label class="block text-sm font-medium text-gray-600">
                            Amount
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            id="amount"
                            required
                            placeholder="Enter amount"
                            class="w-full mt-1 p-2 border rounded-md"
                        >
                    </div>


                    <div>
                        <label class="block text-sm font-medium text-gray-600">
                            Category
                        </label>

                        <select
                            id="category"
                            required
                            class="w-full mt-1 p-2 border rounded-md"
                        >
                            <option value="">
                                Select Category
                            </option>
                        </select>
                    </div>


                    <div>
                        <label class="block text-sm font-medium text-gray-600">
                            Date
                        </label>

                        <input
                            type="date"
                            id="date"
                            required
                            class="w-full mt-1 p-2 border rounded-md"
                        >
                    </div>


                    <div>
                        <label class="block text-sm font-medium text-gray-600">
                            Description
                        </label>

                        <textarea
                            id="description"
                            placeholder="Enter description"
                            class="w-full mt-1 p-2 border rounded-md"
                        ></textarea>
                    </div>


                    <button
                        type="submit"
                        class="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700"
                    >
                        Save Expense
                    </button>

                </form>

            </div>


            <!-- Analytics -->

            <div class="bg-white p-6 rounded-lg shadow-md md:col-span-2">

                <h2 class="text-xl font-semibold mb-4 text-gray-700">
                    Analytics Overview
                </h2>


                <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded mb-6">

                    <p class="text-sm text-blue-700 font-medium">
                        Total Spending
                    </p>

                    <p
                        id="total-spending"
                        class="text-2xl font-bold text-blue-900"
                    >
                        ₹0.00
                    </p>

                </div>


                <!-- Search and Filter -->

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">

                    <div>

                        <label class="block text-sm font-medium text-gray-600 mb-1">
                            Search Expense
                        </label>

                        <input
                            type="text"
                            id="search-input"
                            placeholder="Search by title..."
                            class="w-full p-2 border rounded-md"
                        >

                    </div>


                    <div>

                        <label class="block text-sm font-medium text-gray-600 mb-1">
                            Filter by Category
                        </label>

                        <select
                            id="filter-category"
                            class="w-full p-2 border rounded-md"
                        >

                            <option value="">
                                All Categories
                            </option>

                        </select>

                    </div>

                </div>


                <!-- Recent Transactions -->

                <h3 class="text-lg font-semibold mb-3 text-gray-700">
                    Recent Transactions
                </h3>


                <div class="overflow-x-auto">

                    <table class="min-w-full bg-white text-sm">

                        <thead>

                            <tr class="bg-gray-200 text-gray-600 uppercase text-xs">

                                <th class="py-2 px-4 text-left">
                                    Date
                                </th>

                                <th class="py-2 px-4 text-left">
                                    Item
                                </th>

                                <th class="py-2 px-4 text-left">
                                    Category
                                </th>

                                <th class="py-2 px-4 text-right">
                                    Amount
                                </th>

                                <th class="py-2 px-4 text-center">
                                    Action
                                </th>

                            </tr>

                        </thead>


                        <tbody
                            id="expense-table-body"
                            class="text-gray-600"
                        >

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>


    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>

</html>
